  0% {

  }

  25% {

  }

  }

  }

  100% {

  30% {
    transform: translateY(-60px) scale(1.25);
  }

  70% {
    transform: translateY(-60px) scale(1.25);
  }

  100% {
    transform: translateY(0) scale(1);
  }
}

.one-3 {

}

@keyframes one3-motion {

  }

  50% {
    transform: translate(20px, 20px) scale(1.1) rotate(18deg);
  }

  100% {

  }
}

  top: 230px;

 width: 45px;

  0% {

    opacity: 1;
  }
