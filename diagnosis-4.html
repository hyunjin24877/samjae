<!DOCTYPE html>
<html lang="ko">

<head>
  <script src="js/diagnosis-session.js?v=20261003-pages"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>당신의 삼재를 진단해드립니다.</title>

  <link rel="stylesheet" href="css/font.css?v=20261004-font">
  <link rel="stylesheet" href="css/header.css?v=20261004-center">
  <link rel="stylesheet" href="css/background.css?v=20261004-font">
  <link rel="stylesheet" href="css/diagnosis-common.css?v=20261004-controls">
  <link rel="stylesheet" href="css/diagnosis-4.css?v=20261003-pages">
  <link rel="stylesheet" href="css/diagnosis-scroll.css?v=20261003-pages">
  <script src="js/site-cursor.js?v=20261003-pages" defer></script>
  <link rel="stylesheet" href="css/page-stage.css?v=20261004-font">
  <script src="js/page-stage.js?v=20261003-pages" defer></script>
</head>


<body>

  <!-- =====================
       배경
  ====================== -->

  <img
    src="img/back/back-dote.webp"
    class="back-dote"
    alt=""
  >

  <video src="img/back/back2-all.webm" class="back2" autoplay muted loop playsinline aria-hidden="true"></video>

  <img
    src="img/back/back-grey-gradient.webp"
    class="back-grey-gradient"
    alt=""
  >

  <div class="black-overlay"></div>


  <!-- =====================
       옆 문
  ====================== -->

  <div class="doors">

    <img
      src="img/door.svg"
      class="door door-left"
      alt=""
    >

    <img
      src="img/door.svg"
      class="door door-right"
      alt=""
    >

  </div>


  <!-- =====================
       헤더
  ====================== -->

  <header class="header">

    <div class="header-controls">

      <button
        class="circle-btn"
        onclick="location.href='landing.html'"
        type="button"
      >
        <span class="inner-circle">
          <img src="img/home.svg" alt="홈">
        </span>
      </button>


      <button
        class="circle-btn"
        onclick="history.back()"
        type="button"
      >
        <span class="inner-circle">
          <img src="img/prev.svg" alt="이전">
        </span>
      </button>


      <button
        class="circle-btn"
        onclick="history.forward()"
        type="button"
      >
        <span class="inner-circle">
          <img src="img/next.svg" alt="다음">
        </span>
      </button>

    </div>

  </header>


  <!-- =====================
       진단 2번
  ====================== -->

  <main class="diagnosis-main">


    <!-- =====================
         열린 족자
    ====================== -->

    <div class="diagnosis-open-wrap">

      <img
        src="img/diagnosis/diagnosis-open.svg"
        class="diagnosis-open"
        alt=""
      >


      <!-- 질문 -->

      <div class="diagnosis-result">

        <img class="diagnosis-result-number" src="img/diagnosis/4.svg" alt="4단계">


        <div class="diagnosis-result-drops">

          <img
            src="img/diagnosis/diagnosis-fire.svg"
            class="diagnosis-fire active"
            alt=""
          >

          <img
            src="img/diagnosis/diagnosis-fire.svg"
            class="diagnosis-fire active"
            alt=""
          >

          <img
            src="img/diagnosis/diagnosis-fire.svg"
            class="diagnosis-fire"
            alt=""
          >

          <img
            src="img/diagnosis/diagnosis-fire.svg"
            class="diagnosis-fire"
            alt=""
          >

          <img
            src="img/diagnosis/diagnosis-fire.svg"
            class="diagnosis-fire"
            alt=""
          >

        </div>


        <p class="diagnosis-result-text body2">
          당신은 어떤 문화에 더 밀접한가요?<br>
          문제 발생시 어느 문화에 기대어 해결하려고 하나요?
        </p>
        <p class="diagnosis-annotation body2">
        *1번 질문을 계속 생각하면서 테스트에 응해주세요.
        </p>

      </div>

    </div>


    <!-- =====================
         2번 이미지 선택
    ====================== -->

    <div class="diagnosis-choices">


      <!-- 민간신앙 -->

      <button
        type="button"
        class="diagnosis-choice diagnosis-card"
        data-value="shamanism"
      >
        <img class="diagnosis-card-back" src="img/diagnosis/card_back.svg" alt="" aria-hidden="true">
        <span class="diagnosis-card-art-wrap" aria-hidden="true">
          <img class="diagnosis-card-art" src="img/diagnosis/diagnosis-shamanism-poster.png" alt="" aria-hidden="true">
          <video class="diagnosis-card-video diagnosis-motion-shamanism" src="img/diagnosis/diagnosis-shamanism-art.webm" muted playsinline preload="metadata" aria-hidden="true"></video>
        </span>
        <span class="diagnosis-card-label body2">민간신앙</span>
      </button>


      <!-- 종교 -->

      <button
        type="button"
        class="diagnosis-choice diagnosis-card"
        data-value="religion"
      >
        <img class="diagnosis-card-back" src="img/diagnosis/card_back.svg" alt="" aria-hidden="true">
        <span class="diagnosis-card-art-wrap" aria-hidden="true">
          <img class="diagnosis-card-art" src="img/diagnosis/diagnosis-religion-art.svg" alt="" aria-hidden="true">
          <video class="diagnosis-card-video diagnosis-motion-religion" src="img/diagnosis/diagnosis-religion-art.webm" muted playsinline preload="metadata" aria-hidden="true"></video>
        </span>
        <span class="diagnosis-card-label body2">종교</span>
      </button>


    </div>


    <!-- =====================
         하단 버튼
    ====================== -->

    <div class="diagnosis-controls">


      <!-- 미선택 팝업 -->

      <img
        src="img/diagnosis/diagnosis-popup.svg"
        class="diagnosis-popup"
        id="diagnosisPopup"
        alt=""
      >


      <div class="diagnosis-button-row">


        <!-- 이전 -->

        <button
          type="button"
          class="diagnosis-btn"
          id="diagnosisPrev"
        >
          <img
            class="diagnosis-btn-img"
            src="img/diagnosis/diagnosis-pre.svg"
            alt="이전"
          >
        </button>


        <!-- 다음 -->

        <button
          type="button"
          class="diagnosis-btn is-disabled"
          id="diagnosisNext"
        >
          <img
            class="diagnosis-btn-img"
            id="diagnosisNextImg"
            src="img/diagnosis/diagnosis-next-disable.svg"
            alt="다음"
          >
        </button>

      </div>


      <!-- 다시하기 -->

     <button
  type="button"
  class="diagnosis-reset button-filter"
  id="diagnosisReset"
>
  다시하기
</button>

    </div>

  </main>


<script src="js/diagnosis-common.js?v=20261003-pages"></script>


  <script src="js/diagnosis-transition.js?v=20261003-pages"></script>
</body>

</html>
